name: Build and Push Docker Image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from commit message
        id: version
        env:
          # Pass via env, NOT inline ${{ }} interpolation: the commit message is
          # untrusted text and splicing it into the script lets backticks/quotes
          # run as shell (a `docker build` backtick in a message once executed
          # docker with no args and failed the job).
          MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(printf '%s' "$MSG" | grep -oP 'release:\s*\K[0-9]+\.[0-9]+\.[0-9]+' || echo "")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/homes:latest
            ${{ steps.version.outputs.version && format('{0}/homes:{1}', secrets.DOCKERHUB_USERNAME, steps.version.outputs.version) || '' }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Portainer redeploy
        run: curl -X POST https://portainer.jp.serial-experiments.com/api/stacks/webhooks/5834edec-6363-4c9c-b534-1b4e04f0ff84
